name: Local core checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      authorized_live_smokes:
        description: 'Run real GitHub acquisition smokes only after separate scope approval'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  web-build:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm install --global pnpm@11.25.0 --ignore-scripts
      - name: Install from frozen lockfile
        run: bash scripts/sites-env.sh -- bash scripts/install-pnpm.sh
      - run: node --test tests/*.test.mjs
      - run: node node_modules/typescript/bin/tsc --noEmit --incremental false
      - run: node scripts/run-framework.mjs build
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  github-live:
    # Real acquisition/analysis, not a synthetic test. Never run on a PR push.
    # Keep the smoke intact; a separate authorization is needed to dispatch it.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.event.repository.private == false &&
      inputs.authorized_live_smokes == true &&
      github.repository == 'ofelipepeixoto/security-workbench'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Aquisição real do repositório público pela CLI e HTTP local
        run: python -m scripts.smoke_github
        env:
          GITHUB_TOKEN: ${{ github.token }}

  web-scanner:
    if: >-
      github.event.repository.private == false &&
      github.repository == 'ofelipepeixoto/security-workbench' &&
      ((github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_dispatch' && inputs.authorized_live_smokes == true))
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      # A suíte completa, incluindo SSR/React, roda em web-build após instalar
      # o lockfile. Este job preserva o smoke do núcleo sem dependências npm.
      - name: Testes do scanner e autorização sem dependências npm
        run: >-
          node --test
          web/tests/scanner.test.mjs
          web/tests/service.test.mjs
          web/tests/rea-import.test.mjs
          web/tests/github-auth.test.mjs
          web/tests/github-owner-integration.test.mjs
          web/tests/workbench-access.test.mjs
      - name: Leitura real pública do REA autorizado
        if: github.event_name == 'workflow_dispatch' && inputs.authorized_live_smokes == true
        run: node web/tests/live-smoke.mjs
